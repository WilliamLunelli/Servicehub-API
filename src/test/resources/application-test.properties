# Perfil de teste: banco H2 em memoria (rapido, sem Docker)
spring.datasource.url=jdbc:h2:mem:servicehub-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=test-secret-with-at-least-32-characters-long-0123456789
jwt.expiration-ms=3600000
