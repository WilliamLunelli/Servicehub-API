spring.application.name=servicehub-api

# PostgreSQL database (em producao, defina DB_USERNAME e DB_PASSWORD; os valores abaixo sao apenas para desenvolvimento)
spring.datasource.url=jdbc:postgresql://localhost:5432/servicehub
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT (em producao, defina JWT_SECRET com no minimo 32 caracteres; o valor abaixo e apenas para desenvolvimento)
jwt.secret=${JWT_SECRET:servicehub-dev-secret-change-me-in-production-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrador inicial (opcional): so e criado se as duas variaveis estiverem definidas
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# GraphQL (endpoint alternativo em /graphql)
spring.graphql.graphiql.enabled=false
